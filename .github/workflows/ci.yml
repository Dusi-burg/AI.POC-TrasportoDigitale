name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    # Windows because the integration tests provision throwaway databases on
    # SQL Server LocalDB, which only exists on Windows.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The VECTOR type exists only from SQL Server 2025 (LocalDB 17.x). On an
      # older LocalDB the tests that need it are skipped and stay mandatory locally.
      - name: Start SQL Server LocalDB instance 'localdev'
        id: localdb
        shell: pwsh
        run: |
          $versions = sqllocaldb versions
          $versions
          $major = ($versions | Select-String '\((\d+)\.' | ForEach-Object { [int]$_.Matches[0].Groups[1].Value } | Measure-Object -Maximum).Maximum
          sqllocaldb create localdev -s
          sqllocaldb info localdev
          if ($major -ge 17) {
            "filter=" >> $env:GITHUB_OUTPUT
          } else {
            Write-Output "::warning::LocalDB $major.x has no VECTOR type (SQL Server 2025 required): tests in category RequiresSql2025 skipped."
            "filter=--filter TestCategory!=RequiresSql2025" >> $env:GITHUB_OUTPUT
          }

      - name: Restore
        run: dotnet restore Dusiburg.AI.Trasporto.slnx

      - name: Build
        run: dotnet build Dusiburg.AI.Trasporto.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution Dusiburg.AI.Trasporto.slnx --configuration Release --no-build ${{ steps.localdb.outputs.filter }}
